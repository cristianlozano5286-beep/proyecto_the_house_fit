<section class="auth-card">
  <div class="auth-header">
    <span class="auth-badge">Bienvenido</span>
    <h2>Iniciar sesión</h2>
  </div>

  <form (ngSubmit)="login()">
    <label>
      Correo
      <input type="email" [(ngModel)]="email" name="email" required />
    </label>

    <label>
      Contraseña
      <input type="password" [(ngModel)]="password" name="password" required />
    </label>

    <button type="submit">Entrar</button>
  </form>

  <p *ngIf="mensaje" class="error-msg">{{ mensaje }}</p>
  <a routerLink="/auth/register">Crear cuenta</a>
</section>
<div class="login-container">
  <!-- Carrusel de imágenes de fondo -->
  <div class="bg-slider">
    <div class="slide slide-1"></div>
    <div class="slide slide-2"></div>
    <div class="slide slide-3"></div>
    <div class="slide slide-4"></div>
  </div>

  <!-- Tarjeta de Login Estilizada -->
  <div class="login-card">
    <div class="login-header">
      <img src="assets/logo.png" alt="THE HOUSE FIT Logo" class="brand-logo">
      <span class="subtitle-badge">INICIO DE SESIÓN</span>
    </div>

    @if (mensaje) {
      <div class="alert error">
        {{ mensaje }}
      </div>
    }

    <form (ngSubmit)="login()">
      <!-- Campo Correo -->
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <div class="input-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input 
            type="email" 
            id="email" 
            name="email"
            [(ngModel)]="email" 
            placeholder="ejemplo@correo.com"
            required>
        </div>
      </div>

      <!-- Campo Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input 
            type="password" 
            id="password" 
            name="password"
            [(ngModel)]="password" 
            placeholder="••••••••"
            required>
        </div>
      </div>

      <div class="form-actions">
        <a routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>
      </div>

      <div class="buttons">
        <button type="submit" class="btn-primary">Iniciar Sesión</button>
        <button type="button" class="btn-secondary" (click)="goToRegister()">Registrarme</button>
        <a routerLink="/" class="link-back">← Volver al inicio</a>
      </div>
    </form>
  </div>
</div>
