<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>The House Fit</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#12141a">
  <meta name="background-color" content="#12141a">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('color-scheme');
        var meta = document.querySelector('meta[name="color-scheme"]');
        var resolved;
        if (stored === 'light' || stored === 'dark') {
          if (meta) meta.content = stored;
          resolved = stored;
        } else {
          if (meta) meta.content = 'light dark';
          var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          resolved = sysDark ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = resolved;
        var bg = resolved === 'light' ? '#f4f3ee' : '#12141a';
        var tc = document.querySelector('meta[name="theme-color"]');
        var bc = document.querySelector('meta[name="background-color"]');
        if (tc) tc.content = bg;
        if (bc) bc.content = bg;
      } catch (e) {}
    })();
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="House Fit">
  <meta name="application-name" content="The House Fit">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/logo-icon-orange.png">
  <link rel="apple-touch-icon" href="assets/logo-icon-orange.png">
</head>
<body>
  <app-root></app-root>
</body>
</html>
